{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-pod-postmortem.fullname" . }}
  labels:
    {{- include "k8s-pod-postmortem.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources:
    - pods
    - pods/log
    - events
  verbs:
    - get
    - list
    - watch
{{- if .Values.config.includeNodeInfo }}
- apiGroups: [""]
  resources:
    - nodes
  verbs:
    - get
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-pod-postmortem.fullname" . }}
  labels:
    {{- include "k8s-pod-postmortem.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8s-pod-postmortem.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "k8s-pod-postmortem.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}