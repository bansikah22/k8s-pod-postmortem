name: 'Kubernetes Pod Post-Mortem'
description: 'Automatically capture and analyze Kubernetes pod failure diagnostics for CI/CD workflows'
author: 'bansikah22'
branding:
  icon: 'activity'
  color: 'blue'

inputs:
  log-tail-lines:
    description: 'Number of log lines to tail from previous container'
    required: false
    default: '200'
  include-node-info:
    description: 'Include node information in diagnostics'
    required: false
    default: 'false'
  redact-secrets:
    description: 'Redact sensitive data from output'
    required: false
    default: 'true'
  output-format:
    description: 'Output format (markdown)'
    required: false
    default: 'markdown'
  namespace:
    description: 'Kubernetes namespace (auto-detected if empty)'
    required: false
    default: ''
  pod-name:
    description: 'Pod name (auto-detected if empty)'
    required: false
    default: ''
  debug:
    description: 'Enable debug logging'
    required: false
    default: 'false'
  timeout:
    description: 'Action timeout in seconds'
    required: false
    default: '10s'

outputs:
  failure-type:
    description: 'Classification of the failure type'
    value: ${{ steps.postmortem.outputs.failure-type }}
  failure-reason:
    description: 'Reason for the failure'
    value: ${{ steps.postmortem.outputs.failure-reason }}
  namespace:
    description: 'Kubernetes namespace of the pod'
    value: ${{ steps.postmortem.outputs.namespace }}
  pod-name:
    description: 'Name of the pod'
    value: ${{ steps.postmortem.outputs.pod-name }}

runs:
  using: 'composite'
  steps:
    - name: Download Precompiled Binary
      shell: bash
      run: |
        # Get the action version from the reference
        ACTION_VERSION="${{ github.action_ref }}"
        
        # Remove 'v' prefix if present
        VERSION="${ACTION_VERSION#v}"
        
        # As fallback, use the latest version
        if [[ -z "$VERSION" ]] || [[ "$VERSION" == "master" ]] || [[ "$VERSION" == "main" ]]; then
          VERSION="1.0.0"
          echo "No version detected, using default: $VERSION"
        else
          echo "Using version: $VERSION"
        fi
        
        echo "Downloading from: https://github.com/bansikah22/k8s-pod-postmortem/releases/download/v${VERSION}/postmortem"
        
        # Download with error handling
        if ! curl -L -f -o postmortem \
          "https://github.com/bansikah22/k8s-pod-postmortem/releases/download/v${VERSION}/postmortem"; then
          echo "Download failed! Check if release exists at: https://github.com/bansikah22/k8s-pod-postmortem/releases/tag/v${VERSION}"
          exit 1
        fi
        
        chmod +x postmortem
        
        # Debug info
        ls -la postmortem
        file postmortem
    
    - name: Run Post-Mortem
      id: postmortem
      shell: bash
      run: |
        ./postmortem \
          --log-tail-lines="${{ inputs.log-tail-lines }}" \
          --include-node-info="${{ inputs.include-node-info }}" \
          --redact-secrets="${{ inputs.redact-secrets }}" \
          --output-format="${{ inputs.output-format }}" \
          --namespace="${{ inputs.namespace }}" \
          --pod-name="${{ inputs.pod-name }}" \
          --debug="${{ inputs.debug }}" \
          --timeout="${{ inputs.timeout }}"
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
